[project]
name = "airflash"
version = "0.1.0"
description = "Capture Windows system audio and stream it to AirPlay 2 devices (HomePod)"
readme = "README.md"
requires-python = ">=3.12"
license = { text = "GPL-3.0-or-later OR AirFlash Commercial License" }
authors = [{ name = "Ding-Kyoma" }]
dependencies = ["numpy>=2.0"]

[dependency-groups]
dev = ["ruff>=0.4", "pytest>=8.0", "pytest-asyncio>=0.23"]

[tool.uv]
package = false

[tool.ruff]
line-length = 100
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "I", "W", "UP", "B"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]
asyncio_mode = "auto"
