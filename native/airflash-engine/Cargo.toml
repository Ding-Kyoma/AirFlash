[package]
name = "airflash-engine"
version = "0.1.0"
edition = "2024"
license = "GPL-3.0-or-later OR AirFlash Commercial License"
rust-version = "1.85"

[dependencies]
anyhow = "1"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
plist = "1"
rand = "0.8"
num-bigint = "0.4"
sha2 = "0.10"
hkdf = "0.12"
chacha20poly1305 = "0.10"
subtle = "2"
zeroize = { version = "1", features = ["derive"] }
uuid = { version = "1", features = ["v4"] }
hound = "3"
rubato = "0.16"
alac-encoder = "0.3"
ed25519-dalek = "2"
x25519-dalek = { version = "2", features = ["static_secrets"] }

[target.'cfg(windows)'.dependencies]
windows = { version = "0.61", features = ["Win32_Media_Audio", "Win32_Media_Multimedia", "Win32_System_Com", "Win32_System_Com_StructuredStorage", "Win32_System_Variant", "Win32_System_Threading", "Win32_Foundation", "Win32_Security", "Win32_Security_Cryptography", "Win32_Storage_FileSystem", "Win32_UI_Shell_PropertiesSystem", "Win32_Devices_FunctionDiscovery", "Win32_System_Performance"] }

[dev-dependencies]
alac = "0.5"

[profile.release]
lto = "thin"
strip = true
