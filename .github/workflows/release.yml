name: Release
on:
  workflow_dispatch:
    inputs:
      version:
        description: 'New X.Y.Z version to reserve; leave empty for automatic increment'
        type: string
        required: false
        default: ''
      publish:
        description: 'Publish a stable release automatically; disable for maintainer publication'
        type: boolean
        required: false
        default: true
permissions:
  contents: read
concurrency:
  group: airflash-release
  cancel-in-progress: false
jobs:
  release:
    if: github.ref == 'refs/heads/main' || github.ref == 'refs/heads/codex/nic-discovery-preview'
    runs-on: windows-2025
    env:
      RELEASE_CHANNEL: ${{ github.ref == 'refs/heads/main' && 'stable' || 'preview' }}
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.sha }}
          fetch-depth: 0
      - name: Reserve an increasing version
        id: version
        shell: pwsh
        env:
          NEW_RELEASE_VERSION: ${{ inputs.version }}
        run: |
          git checkout -B $env:GITHUB_REF_NAME
          . ./scripts/release-version.ps1
          $version = Reserve-ReleaseVersion (Get-Location).Path '' $env:RELEASE_CHANNEL -NewVersion $env:NEW_RELEASE_VERSION
          "version=$version" >> $env:GITHUB_OUTPUT
      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '10.0.x'
      - name: Verify generated icons
        shell: pwsh
        run: pwsh -NoProfile -STA -File scripts/generate-icons.ps1 -Check
      - uses: astral-sh/setup-uv@v6
        with:
          version: '0.8.22'
          python-version: '3.12'
      - name: Python checks
        shell: pwsh
        run: |
          uv sync --locked
          if ($LASTEXITCODE) { exit $LASTEXITCODE }
          uv run pytest
          if ($LASTEXITCODE) { exit $LASTEXITCODE }
          uv run ruff check .
          exit $LASTEXITCODE
      - name: Native checks
        shell: pwsh
        run: ./scripts/build-native.ps1 -Check
      - name: .NET tests
        shell: pwsh
        run: ./scripts/dotnet.ps1 test AirFlash.sln '-p:RestoreLockedMode=true'
      - name: Build and verify
        shell: pwsh
        env:
          RELEASE_VERSION: ${{ steps.version.outputs.version }}
        run: |
          ./scripts/build.ps1 -ReservedVersion $env:RELEASE_VERSION -ReleaseChannel $env:RELEASE_CHANNEL
          ./scripts/verify-release.ps1 -Version $env:RELEASE_VERSION
      - name: Installer lifecycle in disposable runner
        shell: pwsh
        env:
          GH_TOKEN: ${{ github.token }}
        run: ./scripts/test-installer.ps1
      - name: Publish verified stable release
        if: github.ref == 'refs/heads/main' && inputs.publish
        shell: pwsh
        env:
          GH_TOKEN: ${{ github.token }}
          RELEASE_VERSION: ${{ steps.version.outputs.version }}
        run: |
          $tag = 'v' + $env:RELEASE_VERSION
          $sha = git rev-parse HEAD
          gh release create $tag dist/AirFlash.exe dist/AirFlash.msi dist/SHA256SUMS.txt --target $sha --title "AirFlash $env:RELEASE_VERSION" --notes-file docs/RELEASE-NOTES.md --latest
          if ($LASTEXITCODE) { exit $LASTEXITCODE }
      - name: Preserve verified stable assets for maintainer publication
        if: github.ref == 'refs/heads/main' && !inputs.publish
        uses: actions/upload-artifact@v4
        with:
          name: airflash-release-${{ steps.version.outputs.version }}-${{ github.sha }}
          path: |
            dist/AirFlash.exe
            dist/AirFlash.msi
            dist/SHA256SUMS.txt
          if-no-files-found: error
          retention-days: 14
      - name: Preserve verified preview assets for maintainer publication
        if: github.ref == 'refs/heads/codex/nic-discovery-preview'
        uses: actions/upload-artifact@v4
        with:
          name: airflash-preview-${{ steps.version.outputs.version }}-${{ github.sha }}
          path: |
            dist/AirFlash.exe
            dist/AirFlash.msi
            dist/SHA256SUMS.txt
          retention-days: 14
      - name: Preserve failure diagnostics
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: release-failure-logs
          path: artifacts/installer-test/*.log
          retention-days: 7
