name: CI
on:
  push:
    branches: [main]
  pull_request:
permissions:
  contents: read
jobs:
  test:
    runs-on: windows-2025
    steps:
      - uses: actions/checkout@v4
      - name: Verify generated icons
        shell: pwsh
        run: pwsh -NoProfile -STA -File scripts/generate-icons.ps1 -Check
      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '10.0.x'
      - uses: astral-sh/setup-uv@v6
        with:
          version: '0.8.22'
          python-version: '3.12'
      - name: Python checks
        shell: pwsh
        run: |
          uv sync --locked
          if ($LASTEXITCODE) { exit $LASTEXITCODE }
          uv run pytest
          if ($LASTEXITCODE) { exit $LASTEXITCODE }
          uv run ruff check .
          exit $LASTEXITCODE
      - name: Native checks and build
        shell: pwsh
        run: ./scripts/build-native.ps1 -Check
      - name: .NET tests
        shell: pwsh
        run: ./scripts/dotnet.ps1 test AirFlash.sln '-p:RestoreLockedMode=true'
      - name: Discovery stability regression
        shell: pwsh
        run: ./scripts/dotnet.ps1 run --project AirFlash.App/AirFlash.App.csproj --no-restore -- --stability-check --output ../artifacts/discovery-stability.json
      - name: Audit self-contained bundle
        shell: pwsh
        run: ./scripts/dotnet.ps1 publish AirFlash.App/AirFlash.App.csproj -c Release -r win-x64 --self-contained true '-p:IncludeNativeLibrariesForSelfExtract=true' '-p:RestoreLockedMode=true' -o (Join-Path (Get-Location).Path 'artifacts/compatibility-publish')
      - name: Verify packaged startup and compatibility
        shell: pwsh
        run: |
          $exe = (Resolve-Path artifacts/compatibility-publish/AirFlash.exe).Path
          foreach ($check in @('self-check', 'compat-check')) {
            $report = [IO.Path]::GetFullPath("artifacts/compatibility/$check.json")
            $process = Start-Process -FilePath $exe -ArgumentList @("--$check", '--output', ('"' + $report + '"')) -PassThru -WindowStyle Hidden
            if (-not $process.WaitForExit(30000)) { $process.Kill(); throw "$check timed out" }
            if ($process.ExitCode -ne 0 -or -not (Get-Content $report -Raw | ConvertFrom-Json).ok) { throw "$check failed" }
          }
          $audit = Get-Content artifacts/compatibility/bundle-audit.json -Raw | ConvertFrom-Json
          $audit | Add-Member -NotePropertyName published_exe_sha256 -NotePropertyValue (Get-FileHash $exe -Algorithm SHA256).Hash.ToLowerInvariant() -Force
          $audit | ConvertTo-Json -Depth 20 | Set-Content artifacts/compatibility/bundle-audit.json -Encoding utf8
      - name: Preserve compatibility audit
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: windows-compatibility-audit
          path: artifacts/compatibility/*.json
          retention-days: 14
